<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GitHub-hosted browser web scraper"><title>GitHub Web Scraper</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:0 auto;padding:28px 18px}.hero{background:#172033;color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;opacity:.85}.card{background:#fff;border:1px solid #dfe6ef;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 28px rgba(15,23,42,.06)}form{display:grid;grid-template-columns:1fr auto;gap:10px}input,select,button,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:11px;padding:12px}button{background:#172033;color:#fff;font-weight:700;cursor:pointer;border:0}.secondary{background:#e8edf4;color:#172033}.opts{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}.opt{display:flex;gap:7px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{font-size:25px;font-weight:800}.small{font-size:13px;color:#64748b}.list{max-height:330px;overflow:auto}.row{padding:9px 0;border-bottom:1px solid #edf1f6;word-break:break-word}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab.active{background:#172033;color:#fff}.tab{background:#e8edf4;color:#172033}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}.data{border-collapse:collapse;width:100%}.data th,.data td{border:1px solid #dfe6ef;padding:7px;text-align:left}.notice{padding:12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}@media(max-width:800px){form,.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="hero"><h1>GitHub Web Scraper</h1><p>A browser-only scraper hosted from GitHub. No Python server required.</p></div><div class="card"><div class="tabs"><button class="tab active" data-tab="urltab">URL Scraper</button><button class="tab" data-tab="htmltab">HTML Analyzer</button><button class="tab" data-tab="sitemap">Sitemap</button></div><section id="urltab"><form id="form"><input id="url" type="url" placeholder="https://example.com" required><button>Scrape</button></form><div class="opts"><label class="opt"><input id="allText" type="checkbox" checked> Text</label><label class="opt"><input id="links" type="checkbox" checked> Links</label><label class="opt"><input id="images" type="checkbox" checked> Images</label><label class="opt"><input id="tables" type="checkbox" checked> Tables</label><label class="opt"><input id="meta" type="checkbox" checked> Metadata</label><label class="opt"><input id="keywords" type="checkbox" checked> Keywords</label><label class="opt">CSS selector <input id="selector" placeholder="optional"></label></div></section><section id="htmltab" class="hidden"><textarea id="htmlInput" rows="8" style="width:100%" placeholder="Paste page HTML here"></textarea><div class="actions"><button id="analyze">Analyze HTML</button></div></section><section id="sitemap" class="hidden"><form id="siteForm"><input id="siteUrl" type="url" placeholder="https://example.com/sitemap.xml" required><button>Read Sitemap</button></form></section><div id="status" style="margin-top:14px"></div></div><div id="results" class="hidden"><div class="grid"><div class="card"><div class="stat" id="pageTitle">—</div><div class="small">Title</div></div><div class="card"><div class="stat" id="nLinks">0</div><div class="small">Links</div></div><div class="card"><div class="stat" id="nImages">0</div><div class="small">Images</div></div><div class="card"><div class="stat" id="nTables">0</div><div class="small">Tables</div></div></div><div class="card"><div class="actions"><button class="secondary" id="jsonBtn">Download JSON</button><button class="secondary" id="csvBtn">Download CSV</button></div><p class="small" id="source"></p></div><div class="card"><h2>Keywords</h2><div id="kw" class="list"></div></div><div class="card"><h2>Headings</h2><div id="heads" class="list"></div></div><div class="card"><h2>Links</h2><div id="linkList" class="list"></div></div><div class="card"><h2>Images</h2><div id="imageList" class="list"></div></div><div class="card"><h2>Tables</h2><div id="tableList"></div></div><div class="card"><h2>Text</h2><div id="bodyText" class="list"></div></div></div></div><script>
const $=x=>document.getElementById(x), esc=x=>{const d=document.createElement('div');d.textContent=x??'';return d.innerHTML};let result={};const stop=new Set('a an and are as at be by for from has have he her his i if in is it its me my of on or our she so than that the their them then there these they this to was we were what when where which who will with you your about after again all also am any because been before being but can could did do does doing down during each few had how into more most no nor not now only other over own same should some such too very'.split(' '));
for(const b of document.querySelectorAll('.tab'))b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')};
function analyze(html,source){const doc=new DOMParser().parseFromString(html,'text/html');const clean=doc.cloneNode(true);clean.querySelectorAll('script,style,noscript,template,svg').forEach(x=>x.remove());const text=(clean.body?.innerText||clean.documentElement?.textContent||'').replace(/\s+/g,' ').trim();const words=(text.toLowerCase().match(/[a-z][a-z'-]{2,}/g)||[]).filter(w=>!stop.has(w));const counts={};words.forEach(w=>counts[w]=(counts[w]||0)+1);const links=[...doc.querySelectorAll('a[href]')].map(a=>({text:a.innerText.trim(),url:new URL(a.getAttribute('href'),source||location.href).href}));const imgs=[...doc.querySelectorAll('img[src]')].map(i=>({alt:i.alt||'',url:new URL(i.getAttribute('src'),source||location.href).href}));const tables=[...doc.querySelectorAll('table')].map((t,i)=>({index:i+1,rows:[...t.rows].map(r=>[...r.cells].map(c=>c.innerText.trim()))}));const selected=$('selector').value?[...doc.querySelectorAll($('selector').value)].map(x=>x.innerText.trim()):[];result={url:source||'',title:doc.title,metadata:{description:doc.querySelector('meta[name="description"]')?.content||'',keywords:doc.querySelector('meta[name="keywords"]')?.content||'',canonical:doc.querySelector('link[rel="canonical"]')?.href||''},headings:[...doc.querySelectorAll('h1,h2,h3')].map(x=>x.innerText.trim()),links,images:imgs,tables,selected,keywords:Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,100).map(([keyword,count])=>({keyword,count})),text};render(result)}
async function fetchPage(url){$('status').innerHTML='Fetching page…';const r=await fetch(url,{redirect:'follow'});if(!r.ok)throw Error(`HTTP ${r.status}`);return {html:await r.text(),url:r.url}};
$('form').onsubmit=async e=>{e.preventDefault();try{const x=await fetchPage($('url').value);analyze(x.html,x.url);$('status').innerHTML='<div class="notice ok">Scraped successfully.</div>'}catch(err){$('status').innerHTML='<div class="notice">The browser blocked this request or the site rejected it. Try the HTML Analyzer by pasting the page source. This is a normal browser security rule (CORS), not a server failure.</div>'}};
$('analyze').onclick=()=>{try{analyze($('htmlInput').value,'pasted HTML')}catch(e){$('status').textContent='Invalid HTML: '+e.message}};
$('siteForm').onsubmit=async e=>{e.preventDefault();try{const x=await fetchPage($('siteUrl').value);const doc=new DOMParser().parseFromString(x.html,'application/xml');const urls=[...doc.querySelectorAll('loc')].map(x=>x.textContent.trim()).filter(Boolean);$('status').innerHTML=`<div class="notice ok">Found ${urls.length} URL(s).</div>`;result={sitemap:$('siteUrl').value,urls};$('results').classList.remove('hidden');$('pageTitle').textContent=urls.length;$('nLinks').textContent=0;$('nImages').textContent=0;$('nTables').textContent=0;$('kw').innerHTML=urls.map((u,i)=>`<div class="row">${i+1}. ${esc(u)}</div>`).join('');$('heads').innerHTML='';$('linkList').innerHTML='';$('imageList').innerHTML='';$('tableList').innerHTML='';$('bodyText').textContent=''}catch(e){$('status').innerHTML='<div class="notice">Could not fetch the sitemap. The site may block browser cross-origin requests.</div>'}};
function render(d){$('results').classList.remove('hidden');$('pageTitle').textContent=d.title||'Untitled';$('nLinks').textContent=d.links.length;$('nImages').textContent=d.images.length;$('nTables').textContent=d.tables.length;$('source').textContent=d.url;$('kw').innerHTML=d.keywords.map(x=>`<div class="row"><b>${esc(x.keyword)}</b> — ${x.count}</div>`).join('')||'None';$('heads').innerHTML=d.headings.map((x,i)=>`<div class="row"><b>${i+1}.</b> ${esc(x)}</div>`).join('')||'None';$('linkList').innerHTML=d.links.map(x=>`<div class="row">${esc(x.text)}<div class="small">${esc(x.url)}</div></div>`).join('')||'None';$('imageList').innerHTML=d.images.map(x=>`<div class="row">${esc(x.alt)}<div class="small">${esc(x.url)}</div></div>`).join('')||'None';$('tableList').innerHTML=d.tables.map(t=>`<div class="tablewrap"><table class="data">${t.rows.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')}</table></div><br>`).join('')||'None';$('bodyText').textContent=d.text||''}
function dl(name,type,data){const blob=new Blob([type==='json'?JSON.stringify(data,null,2):csv(data)],{type:type==='json'?'application/json':'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csv(d){const rows=[['field','value']];rows.push(['url',d.url||'']);rows.push(['title',d.title||'']);rows.push(['text',d.text||'']);d.links?.forEach(x=>rows.push(['link',x.url]));d.keywords?.forEach(x=>rows.push(['keyword',`${x.keyword}: ${x.count}`]));return rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')}$('jsonBtn').onclick=()=>dl('scrape.json','json',result);$('csvBtn').onclick=()=>dl('scrape.csv','csv',result);
</script></body></html>
